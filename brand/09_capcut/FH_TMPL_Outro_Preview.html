<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>FH_TMPL_Outro_30s Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap');
  :root{--ink:#121A21;--brass:#B8893A;--lagoon:#2F6F6A;--clay:#C48B78;--ivory:#FFFCF8;--mist:#D8D2C8;--border:#2C3740}
  *{box-sizing:border-box;margin:0}
  body{background:#0B1014;color:var(--mist);font-family:'IBM Plex Sans',sans-serif;display:grid;place-items:center;min-height:100vh;gap:24px;padding:32px}
  .stage{width:960px;height:540px;background:var(--ink);position:relative;overflow:hidden;border-radius:4px}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:80px;opacity:0;animation:cycle 30s linear infinite}
  .slide:nth-child(1){animation-delay:0s}
  .slide:nth-child(2){animation-delay:4s}
  .slide:nth-child(3){animation-delay:12s}
  .slide:nth-child(4){animation-delay:18s}
  .slide:nth-child(5){animation-delay:24s}
  .slide:nth-child(6){animation-delay:28s}
  @keyframes cycle{0%{opacity:0}2%{opacity:1}12%{opacity:1}14%{opacity:0}100%{opacity:0}}
  .bar{width:6px;height:72px;margin-bottom:16px}
  .label{font-size:14px;letter-spacing:2px;font-weight:500;margin-bottom:12px}
  .line{font-size:28px;font-weight:600;color:var(--ivory);max-width:720px}
  .cta-row{display:flex;gap:16px;justify-content:center}
  .btn{padding:14px 36px;border-radius:8px;font-weight:600;font-size:18px}
  .btn.primary{background:var(--brass);color:var(--ivory)}
  .btn.ghost{border:2px solid var(--mist);color:var(--ivory)}
  .brand{text-align:center}
  .brand .arc{width:160px;height:40px;margin:0 auto 16px;stroke:var(--brass);fill:none}
  .brand h1{color:var(--ivory);font-size:42px;font-weight:600;letter-spacing:-0.4px}
  .brand p{margin-top:12px;color:var(--mist)}
  .zones{display:flex;gap:24px;justify-content:center;margin-top:48px}
  .zone{width:200px;height:110px;border:2px dashed var(--border);border-radius:8px}
  button{background:var(--brass);color:var(--ivory);border:0;padding:12px 24px;border-radius:8px;font:600 14px 'IBM Plex Sans',sans-serif;cursor:pointer}
  .meta{font-size:13px;letter-spacing:.04em}
</style>
</head>
<body>
  <p class="meta">FH_TMPL_OUTRO_30S · EP001 production copy</p>
  <div class="stage">
    <div class="slide" style="opacity:1;animation:none"><div class="line" style="opacity:.5">Transition from content…</div></div>
    <div class="slide">
      <div class="bar" style="background:var(--lagoon)"></div>
      <div class="label" style="color:var(--lagoon)">IDEA</div>
      <div class="line">AI pressures tasks - not your whole worth.</div>
    </div>
    <div class="slide">
      <div class="bar" style="background:var(--brass)"></div>
      <div class="label" style="color:var(--brass)">SKILL</div>
      <div class="line">The Task Layer - Map · Label · Run one.</div>
    </div>
    <div class="slide">
      <div class="bar" style="background:var(--clay)"></div>
      <div class="label" style="color:var(--clay)">ACTION</div>
      <div class="line">List 5 tasks. Assist 1. Edit in your voice.</div>
    </div>
    <div class="slide" style="align-items:center">
      <div class="cta-row">
        <div class="btn primary">Subscribe</div>
        <div class="btn ghost">Forward Collective</div>
      </div>
    </div>
    <div class="slide brand">
      <svg class="arc" viewBox="0 0 160 40"><path d="M8 28 Q80 -6 152 14" stroke-width="6" stroke-linecap="round"/></svg>
      <h1>FutureHer</h1>
      <p>Welcome forward.</p>
      <div class="zones"><div class="zone"></div><div class="zone"></div></div>
    </div>
  </div>
  <button onclick="location.reload()">Replay</button>
</body>
</html>
