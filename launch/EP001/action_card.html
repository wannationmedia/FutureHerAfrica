<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FH EP001 Action Card</title>
<style>
  @import url("https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap");
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0B1014;
    font-family: "Satoshi", system-ui, sans-serif;
  }
  .card {
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #F3EFE8 0%, #E8E0D4 100%);
    padding: 80px 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
    position: relative;
  }
  .eyebrow {
    color: #2F6F6A;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  h1 {
    color: #121A21;
    font-size: 56px;
    line-height: 1.1;
    font-weight: 700;
    max-width: 18ch;
  }
  .rule { width: 88px; height: 3px; background: #B8893A; }
  ol {
    color: #3D4A55;
    font-size: 28px;
    font-weight: 500;
    line-height: 1.45;
    padding-left: 36px;
    max-width: 28ch;
  }
  .brand {
    position: absolute;
    right: 64px;
    bottom: 48px;
    color: #6B7380;
    font-size: 20px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Action today · under 30 min</div>
    <h1>Map 5 tasks. Run 1 with AI.</h1>
    <div class="rule"></div>
    <ol>
      <li>Write five work tasks from this week</li>
      <li>Label: Assist · Own · Hybrid</li>
      <li>Draft one with AI — edit in your voice</li>
    </ol>
    <div class="brand">FutureHerAfrica — Ready for what's next.</div>
  </div>
</body>
</html>
